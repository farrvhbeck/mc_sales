<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MC Lead Engine{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-feature-settings: "tnum" 0; }
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  button[disabled] { opacity: .45; cursor: default; }
</style>
</head>
<body class="bg-slate-100 text-slate-900 text-[13px] antialiased">

<nav class="bg-slate-900 text-slate-300 sticky top-0 z-20 shadow">
  <div class="max-w-[1600px] mx-auto px-4 flex items-center gap-1 h-12">
    <a href="/" class="font-semibold text-white mr-5 tracking-tight">MC&nbsp;Lead&nbsp;Engine</a>
    {% for href, label, key in [('/', 'Dashboard', 'home'), ('/sellers', 'Sotuvchilar', 'sellers'),
                                ('/buyers', 'Xaridorlar', 'buyers'), ('/matches', 'Match', 'matches'),
                                ('/health', 'Holat', 'health')] %}
      <a href="{{ href }}"
         class="px-3 py-1.5 rounded font-medium transition-colors
                {{ 'bg-slate-700 text-white' if page == key else 'hover:bg-slate-800 hover:text-white' }}">{{ label }}</a>
    {% endfor %}
  </div>
</nav>

<main class="max-w-[1600px] mx-auto p-4">
  {% block content %}{% endblock %}
</main>

</body>
</html>
