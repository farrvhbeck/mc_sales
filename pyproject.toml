[project]
name = "mc-lead-engine"
version = "0.1.0"
description = "MC/DOT authority buy-sell lead engine"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    "python-multipart>=0.0.20",
]

[project.scripts]
mc = "mc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc"]

[tool.hatch.build.targets.wheel.force-include]
"src/mc/web/static" = "mc/web/static"
"src/mc/web/templates" = "mc/web/templates"
